<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login</title>

<style>
:root {
  --bg: #0d0d0d;
  --card: rgba(22,22,22,0.7);
  --border: #252525;
  --accent: #00ff88;
  --accent2: #00ccff;
  --text: #e0e0e0;
  --text2: #aaa;
}

* { box-sizing: border-box; margin:0; padding:0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  min-height:100vh;
  padding:2rem 0;
}

.container {
  width:100%;
  max-width:420px;
  padding:1.5rem;
}

.card {
  background: var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:2rem;
}

.logo {
  text-align:center;
  margin-bottom:2rem;
}

.logo h1 {
  background: linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}



/* TAB SLIDER */
.tabs {
  position: relative;
  display:flex;
  background:#111;
  border-radius:10px;
  padding:4px;
  margin-bottom:2rem;
}

.tab-indicator {
  position:absolute;
  top:4px;
  left:4px;
  width:calc(50% - 4px);
  height:calc(100% - 8px);
  background:var(--accent);
  border-radius:8px;
  transition: all 0.35s ease;
  z-index:0;
}

.tab {
  flex:1;
  padding:0.7rem;
  border:none;
  background:transparent;
  color:var(--text2);
  cursor:pointer;
  border-radius:8px;
  z-index:1;
}

.tab.active {
  color:#000;
  font-weight:bold;
}

/* PASSWORD STRENGTH */
.strength {
  height:6px;
  border-radius:6px;
  margin-top:6px;
  background:#222;
  overflow:hidden;
}

.strength-bar {
  height:100%;
  width:0%;
  transition: all 0.3s ease;
}

/* BUTTON LOADING */
button.loading {
  pointer-events:none;
  opacity:0.7;
  position:relative;
}

button.loading::after {
  content:'';
  width:16px;
  height:16px;
  border:2px solid #000;
  border-top:2px solid transparent;
  border-radius:50%;
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform:translateY(-50%) rotate(360deg); }
}


.form { display:none; }
.form.active { display:block; }

.input-group { margin-bottom:1.2rem; }

input, select {
  width:100%;
  padding:0.8rem;
  border-radius:8px;
  border:1px solid var(--border);
  background:#00000066;
  color:white;
}

button.main-btn {
  width:100%;
  padding:0.9rem;
  background:var(--accent);
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.msg {
  display:none;
  padding:0.8rem;
  margin-bottom:1rem;
  border-radius:8px;
}

.msg.error { background:#ff4d4d22; color:#ff4d4d; }
.msg.success { background:#00ff8822; color:#00ff88; }

.msg.show { display:block; }

</style>
</head>

<body>
<div class="container">
  <div class="card">

    <div class="logo">
      <h1>Odia AI Agent</h1>
    </div>

<div class="tabs">
  <div class="tab-indicator" id="indicator"></div>
  <button class="tab active" id="loginTab">Login</button>
  <button class="tab" id="registerTab">Register</button>
</div>

    <!-- LOGIN -->
    <div id="loginForm" class="form active">
      <div id="loginMsg" class="msg"></div>

      <div class="input-group">
        <input id="loginUser" placeholder="Username" />
      </div>

      <div class="input-group">
        <input type="password" id="loginPass" placeholder="Password" oninput="checkStrength(this)" />
        <div class="strength-bar" id="strengthBar"></div>
      </div>

      <button class="main-btn" onclick="login()">Login</button>
    </div>

    <!-- REGISTER -->
    <div id="registerForm" class="form">
      <div id="regMsg" class="msg"></div>

      <div class="input-group">
        <input id="regName" placeholder="Full Name" />
      </div>

      <div class="input-group">
        <input id="regUser" placeholder="Username" />
      </div>

      <div class="input-group">
        <input id="regEmail" placeholder="Email" />
      </div>

      <div class="input-group">
        <input type="password" id="regPass" placeholder="Password" />
      </div>

      <div class="input-group">
        <select id="regType">
          <option value="normal_user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>

      <button class="main-btn" onclick="register()">Create Account</button>
    </div>

  </div>
</div>

<script>
const API = "http://127.0.0.1:8000";

// TAB SWITCH
const loginTab = document.getElementById("loginTab");
const registerTab = document.getElementById("registerTab");

loginTab.onclick = () => switchTab('login');
registerTab.onclick = () => switchTab('register');

const indicator = document.getElementById("indicator");

function switchTab(type){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.form').forEach(f=>f.classList.remove('active'));

  if(type==='login'){
    loginTab.classList.add('active');
    document.getElementById('loginForm').classList.add('active');
    indicator.style.left = "4px";
  } else {
    registerTab.classList.add('active');
    document.getElementById('registerForm').classList.add('active');
    indicator.style.left = "calc(50% + 0px)";
  }
}

function checkStrength(element){
  const val = element ? element.value : '';
  const bar = document.getElementById("strengthBar");

  let score = 0;

  if(val.length > 6) score++;
  if(/[A-Z]/.test(val)) score++;
  if(/[0-9]/.test(val)) score++;
  if(/[^A-Za-z0-9]/.test(val)) score++;

  const widths = ["0%","25%","50%","75%","100%"];
  const colors = ["transparent","red","orange","yellow","lime"];

  bar.style.width = widths[score];
  bar.style.background = colors[score];
}

function showMsg(id, text, type){
  const el = document.getElementById(id);
  el.className = 'msg show ' + type;
  el.innerText = text;
}

// LOGIN
async function login(){
  const btn = document.querySelector("#loginForm .main-btn");
  btn.classList.add("loading");

  try {
    const res = await fetch(`${API}/login`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        username: loginUser.value,
        password: document.getElementById('loginPass').value
      })
    });

    const data = await res.json();

    if(!res.ok) throw new Error(data.detail);

    localStorage.setItem('token', data.access_token);
    localStorage.setItem('username', data.username);
    localStorage.setItem('user_type', data.user_type);

    showMsg('loginMsg','Login success','success');

    setTimeout(() => {
      window.location.href = '/ui/index.html';
    }, 1000);

  } catch(err){
    showMsg('loginMsg', err.message || 'Login failed','error');
  }

  btn.classList.remove("loading");
}
// REGISTER
async function register(){
  const btn = document.querySelector("#registerForm .main-btn");
  btn.classList.add("loading");

  try {
    const res = await fetch(`${API}/register`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        full_name: regName.value,
        username: regUser.value,
        email: regEmail.value,
        password: regPass.value,
        user_type: regType.value
      })
    });

    const data = await res.json();

    if(!res.ok) throw new Error(data.detail);

    showMsg('regMsg','Account created','success');
    switchTab('login');

  } catch(err){
    showMsg('regMsg', err.message || 'Failed','error');
  }

  btn.classList.remove("loading");
}
</script>
</body>
</html>
